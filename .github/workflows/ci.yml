name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run source-safe checks
        run: make check

      - name: Check release metadata
        run: python3 projects/Edgi_Talk_M55_PocketJS/tools/release_check.py
